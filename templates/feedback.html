{% extends "base.html" %}
{% block content %}

<style>
    .page-title {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
    }

    .page-subtitle {
        color: #8ea4bd;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .feedback-card, .section-card {
        background: #0d1b2e;
        border: 1px solid #1d3554;
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 0 18px rgba(0, 212, 255, 0.05);
        margin-bottom: 22px;
    }

    .input-field {
        width: 100%;
        background: #081421;
        border: 1px solid #1d3554;
        color: #dce8f5;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 14px;
        outline: none;
    }

    .input-field:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
    }

    .btn-main {
        background: #00d4ff;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        color: black;
        margin-right: 10px;
    }

    .btn-whatsapp {
        background: #25D366;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        text-decoration: none;
        margin-right: 10px;
        display: inline-block;
        border: none;
    }

    .btn-email {
        background: #0d6efd;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        text-decoration: none;
        display: inline-block;
        border: none;
    }

    .btn-delete {
        background: #ff4d6d;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
    }

    .success-popup {
        display: none;
        margin-top: 16px;
        background: rgba(6, 214, 160, 0.15);
        border: 1px solid #06d6a0;
        color: #06d6a0;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 22px;
    }

    .stat-box {
        background: #0d1b2e;
        border: 1px solid #1d3554;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 18px rgba(0, 212, 255, 0.05);
    }

    .stat-label {
        color: #8ea4bd;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .stat-value {
        color: #ffffff;
        font-size: 34px;
        font-weight: bold;
        margin-top: 8px;
    }

    .section-title {
        color: #ffffff;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        margin-bottom: 16px;
    }

    .table {
        color: #dce8f5;
    }

    .table thead {
        background: #081421;
    }

    .table thead th {
        color: #8ea4bd;
        border-bottom: 1px solid #1d3554;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .table td {
        border-bottom: 1px solid #1d3554;
        font-size: 14px;
        vertical-align: middle;
    }

    .table tbody tr:hover {
        background: #0f2942;
    }

    .rating-select {
        background: #081421;
        border: 1px solid #1d3554;
        color: #dce8f5;
        border-radius: 8px;
        padding: 12px;
        width: 100%;
        margin-bottom: 14px;
    }
</style>

<div class="page-title">Feedback & Suggestions</div>
<div class="page-subtitle">
    Submit feedback, contact directly, and view saved feedback records.
</div>

<div class="stats-grid">
    <div class="stat-box">
        <div class="stat-label">Total Feedback</div>
        <div class="stat-value" id="totalFeedback">0</div>
    </div>

    <div class="stat-box">
        <div class="stat-label">Average Rating</div>
        <div class="stat-value" id="averageRating">0</div>
    </div>
</div>

<div class="feedback-card">

    <input type="text" id="name" class="input-field" placeholder="Your Name">

    <textarea id="message" class="input-field" placeholder="Your Feedback" style="height:120px;"></textarea>

    <select id="rating" class="rating-select">
        <option value="">Select Rating</option>
        <option value="1">⭐ 1 - Poor</option>
        <option value="2">⭐⭐ 2 - Fair</option>
        <option value="3">⭐⭐⭐ 3 - Good</option>
        <option value="4">⭐⭐⭐⭐ 4 - Very Good</option>
        <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
    </select>

    <button class="btn-main" onclick="submitFeedback()">Submit Feedback</button>

    <hr style="border-color:#1d3554; margin:20px 0;">

    <button class="btn-whatsapp" onclick="sendWhatsApp()">📱 WhatsApp Me</button>

    <button class="btn-email" onclick="sendEmail()">✉ Email Me</button>

    <div id="successPopup" class="success-popup">
        ✅ Feedback saved successfully!
    </div>

</div>

<div class="section-card">

    <div class="section-title">Saved Feedback</div>

    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Message</th>
                    <th>Rating</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="feedbackTable"></tbody>
        </table>
    </div>

</div>

<script>
function submitFeedback() {
    let name = document.getElementById("name").value;
    let message = document.getElementById("message").value;
    let rating = document.getElementById("rating").value;

    if (name.trim() === "" || message.trim() === "" || rating === "") {
        alert("Please fill in name, feedback, and rating.");
        return;
    }

    fetch("/submit-feedback", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            message: message,
            rating: rating
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById("successPopup").style.display = "block";

            document.getElementById("name").value = "";
            document.getElementById("message").value = "";
            document.getElementById("rating").value = "";

            loadFeedback();
            loadStats();

            setTimeout(() => {
                document.getElementById("successPopup").style.display = "none";
            }, 2500);
        }
    });
}

function loadFeedback() {
    fetch("/feedback-data")
    .then(response => response.json())
    .then(data => {
        let html = "";

        data.forEach(item => {
            html += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.message}</td>
                    <td>${"⭐".repeat(item.rating)}</td>
                    <td>${item.created_at}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteFeedback(${item.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("feedbackTable").innerHTML = html;
    });
}

function deleteFeedback(id) {
    if (!confirm("Are you sure you want to delete this feedback?")) {
        return;
    }

    fetch("/delete-feedback/" + id, {
        method: "DELETE"
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadFeedback();
            loadStats();
        }
    });
}

function loadStats() {
    fetch("/feedback-stats")
    .then(response => response.json())
    .then(data => {
        document.getElementById("totalFeedback").innerText = data.total;
        document.getElementById("averageRating").innerText = data.average_rating + " ⭐";
    });
}

function sendWhatsApp() {
    let name = document.getElementById("name").value;
    let message = document.getElementById("message").value;

    let phoneNumber = "601110522603";

    let text = "Hi, my name is " + name + ". Feedback: " + message;

    let url = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent(text);

    window.open(url, "_blank");
}

function sendEmail() {
    let name = document.getElementById("name").value;
    let message = document.getElementById("message").value;

    let email = "humaira_husna_h@soc.uum.edu.my";
    let subject = "Cyber Threat System Feedback";

    let body = `Hi, my name is ${name}.

Feedback:
${message}`;

    let url = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    window.open(url, "_blank");
}

loadFeedback();
loadStats();
</script>

{% endblock %}
